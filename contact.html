<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frogrealms: Elemental Climb - Contact</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <img src="Lenotion.png" alt="Lenotion Logo" class="nav-logo">
            <button class="menu-btn">☰</button>
            <ul class="nav-links">
                <li><a href="index.html">Главная</a></li>
                <li><a href="beta test pre registration.html">Бета тест</a></li>
                <li><a href="about.html">О нас</a></li>
                <li><a href="info.html">Инвесторам</a></li>
                <li><a href="contact.html">Контакты</a></li>
                <li><a href="faq.html">FAQ</a></li>
            </ul>
        </div>
    </nav>

    <section class="contact-section">
        <h2 class="section-title">Свяжитесь с нами</h2>
        <div class="contact-info">
            <p><i class="fas fa-envelope"></i> Email: <a href="mailto:contact@lenotion.com">contact@lenotion.com</a></p>
            <div class="social-links">
                <a href="https://x.com/yourprofile" target="_blank"><i class="fab fa-twitter"></i>Twitter</a>
                <a href="https://x.com/yourprofile" target="_blank"><i class="fab fa-telegram"></i> Telegram</a>
                <a href="https://discord.gg/yourserver" target="_blank"><i class="fab fa-discord"></i> Discord</a>
                <a href="https://github.com/DRAVBER" target="_blank"><i class="fab fa-github"></i> GitHub</a>
                <a href="https://instagram.com/yourlink" target="_blank"><i class="fab fa-instagram"> instagram</i></a>
                <a href="https://kickstarter.com/yourlink" target="_blank"><i class="fab fa-kickstarter"> kickstarter</i></a>  
            </div>
        </div>
        <form class="contact-form">
            <h3>Отправьте нам сообщение</h3>
            <input type="text" placeholder="Ваше имя" required>
            <input type="email" placeholder="Ваш email" required>
            <textarea placeholder="Ваше сообщение" required></textarea>
            <button type="submit" class="cta-button">Отправить</button>
        </form>
    </section>

    <footer class="footer">
        <div class="footer-content">
            <p class="neon-text">© Lenotion 2025. Все права защищены.</p>
            <div class="social-links">
                <a href="https://discord.gg/yourserver" target="_blank"><i class="fab fa-discord"></i></a>
                <a href="https://kickstarter.com/yourlink" target="_blank"><i class="fab fa-kickstarter"></i></a>
                <a href="https://instagram.com/yourlink" target="_blank"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </footer>

    <script>
        // Бургер-меню
        const menuBtn = document.querySelector('.menu-btn');
        const navLinks = document.querySelector('.nav-links');
        menuBtn.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    </script>
</body>
</html>
