<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenocean Beta Test Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;700&display=swap');

        :root {
            --background: #0E0E0E;
            --card-bg: #151515;
            --border-color: #222;
            --input-bg: #1A1A1A;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --accent-color: #c57403;
            --accent-hover: #ff9500;
            --neon-glow: #22d3ee;
            --neon-purple: #a855f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(45deg, #0E0E0E, #1a1a1a, #0E0E0E);
            background-size: 400%;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            animation: backgroundShift 15s ease infinite;
        }

        @keyframes backgroundShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Частицы на фоне */
        #particles-js {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.8;
        }

        /* Навигация */
        .navbar {
            background: linear-gradient(90deg, #151515, #222, #151515);
            border-bottom: 2px solid var(--neon-glow);
            padding: 1rem 2rem;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 10;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.5);
            animation: neonPulse 2s infinite;
        }

        @keyframes neonPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(34, 211, 238, 0.5); }
            50% { box-shadow: 0 0 40px rgba(34, 211, 238, 0.8); }
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .nav-logo {
            width: 120px;
            filter: drop-shadow(0 0 10px var(--neon-glow));
            transition: transform 0.3s ease;
        }

        .nav-logo:hover {
            transform: scale(1.1);
        }

        .menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--neon-glow);
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .menu-btn:hover {
            transform: rotate(90deg);
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--neon-glow);
            text-decoration: none;
            font-weight: 700;
            font-family: 'Roboto Mono', monospace;
            text-transform: uppercase;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px var(--neon-glow);
        }

        .nav-links a:hover {
            color: var(--neon-purple);
            text-shadow: 0 0 10px var(--neon-purple);
            transform: translateY(-3px);
            display: inline-block;
        }

        .navbar h1 {
            font-size: 1.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--neon-glow), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlow 1.5s ease-in-out infinite;
        }

        @keyframes textGlow {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .navbar span:last-child {
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-color);
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            padding-top: 6rem; /* Учитываем фиксированную навигацию */
            position: relative;
            z-index: 5;
        }

        .card {
            background: linear-gradient(135deg, #151515, #222);
            border: 2px solid var(--neon-glow);
            border-radius: 1rem;
            padding: 2rem;
            width: 100%;
            max-width: 450px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(34, 211, 238, 0.7), 0 0 60px rgba(168, 85, 247, 0.5);
            animation: cardGlow 2s ease-in-out infinite, float 5s ease-in-out infinite;
        }

        @keyframes cardGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(34, 211, 238, 0.7), 0 0 60px rgba(168, 85, 247, 0.5); }
            50% { box-shadow: 0 0 50px rgba(34, 211, 238, 1), 0 0 80px rgba(168, 85, 247, 0.8); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-glow), var(--neon-purple), transparent);
            animation: gradientShift 3s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card-content {
            position: relative;
            z-index: 1;
        }

        .card h2 {
            text-align: center;
            font-size: 2rem;
            font-family: 'Roboto Mono', monospace;
            background: linear-gradient(90deg, var(--neon-glow), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(34, 211, 238, 0.8);
            animation: textPulse 1.5s infinite;
        }

        @keyframes textPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .card p {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
            animation: fadeIn 1s ease-out;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
            transition: transform 0.3s ease;
        }

        .input-group:hover {
            transform: scale(1.02);
        }

        .input-group svg {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            width: 1.5rem;
            height: 1.5rem;
            color: var(--neon-glow);
            animation: iconGlow 1.5s infinite;
        }

        @keyframes iconGlow {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 3rem;
            background: linear-gradient(90deg, #1A1A1A, #222);
            border: 1px solid var(--neon-purple);
            color: var(--text-primary);
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
        }

        input:focus {
            outline: none;
            border-color: var(--neon-glow);
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.7);
            transform: scale(1.02);
        }

        .input-row {
            display: flex;
            gap: 1rem;
        }

        .input-row .input-group {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(90deg, var(--accent-color), var(--neon-glow));
            color: var(--text-primary);
            border: none;
            border-radius: 0.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.5);
            animation: buttonPulse 1.5s infinite;
        }

        @keyframes buttonPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(34, 211, 238, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(34, 211, 238, 0.8); }
        }

        button:hover {
            background: linear-gradient(90deg, var(--neon-glow), var(--neon-purple));
            transform: rotate(2deg);
        }

        button:active {
            transform: scale(0.95);
        }

        #error {
            color: #f56565;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-shadow: 0 0 5px rgba(245, 101, 101, 0.5);
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        #generatedCode {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: linear-gradient(135deg, #1A1A1A, #222);
            border: 2px solid var(--neon-glow);
            border-radius: 0.5rem;
            display: none;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.5);
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        #generatedCode p {
            margin: 0 0 0.5rem 0;
            color: var(--text-secondary);
            text-align: left;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }

        #code {
            font-family: 'Roboto Mono', monospace;
            font-size: 1.25rem;
            color: var(--neon-glow);
            word-break: break-all;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px var(--neon-glow);
            animation: codeGlow 1.5s infinite;
        }

        @keyframes codeGlow {
            0%, 100% { text-shadow: 0 0 10px var(--neon-glow); }
            50% { text-shadow: 0 0 20px var(--neon-glow); }
        }

        footer {
            background: linear-gradient(90deg, #151515, #222, #151515);
            border-top: 2px solid var(--neon-purple);
            padding: 1rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
            animation: footerGlow 2s infinite;
        }

        @keyframes footerGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.5); }
            50% { box-shadow: 0 0 40px rgba(168, 85, 247, 0.8); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        /* Адаптивность для навигации */
        @media (max-width: 768px) {
            .nav-container {
                padding: 0 1rem;
            }
            .menu-btn {
                display: block;
            }
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 60px;
                right: 0;
                background: linear-gradient(90deg, #151515, #222);
                width: 200px;
                padding: 1rem;
                border: 2px solid var(--neon-glow);
                box-shadow: 0 0 20px rgba(34, 211, 238, 0.5);
            }
            .nav-links.active {
                display: flex;
            }
            .nav-links a {
                font-size: 1rem;
                padding: 0.5rem 0;
            }
        }
    </style>
</head>
<body>
    <!-- Частицы на фоне -->
    <div id="particles-js"></div>

    <nav class="navbar">
        <div class="nav-container">
            <img src="Lenotion.png" alt="Lenotion Logo" class="nav-logo">
            <button class="menu-btn">☰</button>
            <ul class="nav-links">
                <li><a href="index.html">Главная</a></li>
                <li><a href="beta-test-pre-registration.html">Beta test</a></li>
                <li><a href="about.html">О нас</a></li>
                <li><a href="info.html">Инвесторам</a></li>
                <li><a href="contact.html">Контакты</a></li>
            </ul>
        </div>
        <h1><span>Leno</span><span>cean</span></h1>
    </nav>

    <main>
        <div class="card">
            <div class="card-content">
                <h2><span>Leno</span><span>cean</span></h2>
                <p>BETA TEST REGISTRATION</p>

                <div class="input-group">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                    </svg>
                    <input type="text" id="cardNumber" placeholder="Card Number" maxlength="19">
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <input type="text" id="expiry" placeholder="MM/YY" maxlength="5">
                    </div>
                    <div class="input-group">
                        <input type="text" id="cvc" placeholder="CVC" maxlength="3">
                    </div>
                </div>

                <div class="input-group">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <input type="text" id="location" placeholder="Location">
                </div>

                <button onclick="generateInviteCode()">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                    </svg>
                    Send Request
                </button>

                <div id="error"></div>

                <div id="generatedCode">
                    <p>Your Invite Code:</p>
                    <div id="code"></div>
                    <button onclick="copyToClipboard()">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        Copy Code
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        @DRAVBERx
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // Particles.js
        particlesJS('particles-js', {
            particles: {
                number: { value: 150, density: { enable: true, value_area: 800 } },
                color: { value: ["#22d3ee", "#a855f7", "#c57403"] },
                shape: { type: "circle" },
                opacity: { value: 0.7, random: true },
                size: { value: 4, random: true },
                line_linked: {
                    enable: true,
                    distance: 120,
                    color: "#22d3ee",
                    opacity: 0.5,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 3,
                    direction: "none",
                    random: true,
                    straight: false,
                    out_mode: "bounce",
                    bounce: true,
                    attract: { enable: false }
                }
            },
            interactivity: {
                detect_on: "canvas",
                events: {
                    onhover: { enable: true, mode: "repulse" },
                    onclick: { enable: true, mode: "push" },
                    resize: true
                },
                modes: {
                    grab: { distance: 400, line_linked: { opacity: 1 } },
                    bubble: { distance: 400, size: 40, duration: 2, opacity: 8, speed: 3 },
                    repulse: { distance: 100, duration: 0.4 },
                    push: { particles_nb: 4 },
                    remove: { particles_nb: 2 }
                }
            },
            retina_detect: true
        });

        // Бургер-меню
        const menuBtn = document.querySelector('.menu-btn');
        const navLinks = document.querySelector('.nav-links');
        menuBtn.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        function formatCardNumber(value) {
            const v = value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
            const matches = v.match(/\d{4,16}/g);
            const match = matches && matches[0] || '';
            const parts = [];

            for (let i = 0, len = match.length; i < len; i += 4) {
                parts.push(match.substring(i, i + 4));
            }

            if (parts.length) {
                return parts.join(' ');
            } else {
                return value;
            }
        }

        function formatExpiry(value) {
            const v = value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
            if (v.length >= 2) {
                return `${v.substring(0, 2)}/${v.substring(2, 4)}`;
            }
            return v;
        }

        document.getElementById('cardNumber').addEventListener('input', function(e) {
            e.target.value = formatCardNumber(e.target.value);
        });

        document.getElementById('expiry').addEventListener('input', function(e) {
            e.target.value = formatExpiry(e.target.value);
        });

        function generateInviteCode() {
            const cardNumber = document.getElementById('cardNumber').value;
            const error = document.getElementById('error');
            const generatedCodeDiv = document.getElementById('generatedCode');
            const codeDiv = document.getElementById('code');

            if (cardNumber.length < 19) {
                error.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Please enter a valid card number
                `;
                generatedCodeDiv.style.display = 'none';
                return;
            }

            error.textContent = "";

            const segments = [
                Math.random().toString(36).substring(2, 10).toUpperCase(),
                Math.random().toString(36).substring(2, 10).toUpperCase(),
                Math.random().toString(36).substring(2, 10).toUpperCase()
            ];
            const code = segments.join('-');

            codeDiv.textContent = code;
            generatedCodeDiv.style.display = 'block';
            generatedCodeDiv.classList.add('fade-in');
        }

        function copyToClipboard() {
            const codeDiv = document.getElementById('code');
            const code = codeDiv.textContent;

            navigator.clipboard.writeText(code).then(() => {
                const copyButton = document.querySelector('#generatedCode button');
                copyButton.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    Copied
                `;
                setTimeout(() => {
                    copyButton.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        Copy Code
                    `;
                }, 2000);
            });
        }
    </script>
</body>
</html>
